name: Build packages
# Builds the .rpm, .deb and Windows packages. Pushing a tag like v0.1.0 also publishes them as a
# pre-release; "Run workflow" only builds them so they can be inspected as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "$REF_NAME" = "v$version" ] || { echo "tag $REF_NAME does not match version $version"; exit 1; }
      - run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0
          python -m pip install -e .
          python -m unittest discover -s tests
  rpm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./packaging/build-rpm.sh 44
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/rpm/*.rpm
  deb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/deb/*.deb
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyinstaller==6.22.3 "PySide6-Essentials>=6.8,<7" "hidapi>=0.14,<1"
      - run: pyinstaller -y --noconfirm packaging/windows/ajazz-linux.spec
      - name: Smoke test the command line program with the simulator
        run: dist/ajazz-linux/ajazz-linux-cli.exe --cli status --demo
      - run: Compress-Archive -Path dist/ajazz-linux -DestinationPath ajazz-linux-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ajazz-linux-windows-x64.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rpm, deb, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --repo "${{ github.repository }}" --prerelease --generate-notes --title "$TAG"
